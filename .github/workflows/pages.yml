name: Verify and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      PAGES_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      # check includes the only production build; upload precisely that verified output.
      - run: npm run check
      - name: Verify dist isolation and project asset paths
        shell: python
        run: |
          import os
          from html.parser import HTMLParser
          from pathlib import Path

          root = Path('dist')
          files = []
          for path in root.rglob('*'):
              if path.is_symlink():
                  raise SystemExit(f'Unexpected artifact link: {path}')
              if path.is_dir() and path != root / 'assets':
                  raise SystemExit(f'Unexpected artifact directory: {path}')
              if path.is_file():
                  relative = path.relative_to(root).as_posix()
                  if relative != 'index.html' and not (path.parent == root / 'assets' and path.suffix in {'.js', '.css'}):
                      raise SystemExit(f'Unexpected artifact file: {relative}')
                  files.append(relative)
          if 'index.html' not in files or not any(p.endswith('.js') for p in files) or not any(p.endswith('.css') for p in files):
              raise SystemExit('Missing production HTML/JS/CSS')

          class Assets(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  for key, url in attrs:
                      if key not in {'src', 'href'} or url.startswith('data:'):
                          continue
                      base = os.environ['PAGES_BASE_PATH']
                      if not url.startswith(base + 'assets/') or url[len(base):] not in files:
                          raise SystemExit(f'Invalid project asset URL: {url}')

          Assets().feed((root / 'index.html').read_text(encoding='utf-8'))
          print('Verified dist-only artifact:', sorted(files))
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
